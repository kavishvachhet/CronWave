version: '3.8'

services:
  app1:
    build: .
    env_file:
      - ../.env
    container_name: job-scheduler-1
    ports:
      - "8080:8080"
    networks:
      - scheduler-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/check"]
      interval: 10s
      timeout: 5s
      retries: 3

  app2:
    build: .
    env_file:
      - ../.env
    container_name: job-scheduler-2
    ports:
      - "8081:8080"
    networks:
      - scheduler-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/check"]
      interval: 10s
      timeout: 5s
      retries: 3

  app3:
    build: .
    env_file:
      - ../.env
    container_name: job-scheduler-3
    ports:
      - "8082:8080"
    networks:
      - scheduler-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/check"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - scheduler-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - scheduler-network
    restart: unless-stopped

networks:
  scheduler-network:
    driver: bridge